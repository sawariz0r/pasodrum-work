<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pasodrum work — join Nordlys Energi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.il-root button{font-family:inherit}
.il-root :focus-visible{outline:2px solid #0E7C66;outline-offset:2px}
.il-input::placeholder{color:#6E6C76}
.il-input:focus{outline:none;border-color:#0E7C66!important;box-shadow:0 0 0 4px #E2F2EC}
.il-ghost:hover{background:#F0EEE9!important}
</style>
</helmet>
<div class="il-root" style="width: 100%; min-height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F6F3; color: #1D1C22; font-family: Inter, {{cjk}}system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <header style="display: flex; align-items: center; gap: 10px; padding: 20px 28px">
    <span style="width: 30px; height: 30px; border-radius: 9px; background: #0E7C66; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="13" width="3.6" height="7" rx="1.8" fill="#FFFFFF"></rect><rect x="10.2" y="8.5" width="3.6" height="11.5" rx="1.8" fill="#FFFFFF"></rect><rect x="16.4" y="4" width="3.6" height="16" rx="1.8" fill="#FFFFFF"></rect></svg></span>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700">pasodrum <span style="font-weight: 500; color: #6E6C76">work</span></span>
    <div style="flex: 1"></div>
    <a href="#" class="il-ghost" style="display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px; border-radius: 9px; color: #1D1C22; font-size: 14px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>{{tDownloadApp}}</a>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px 72px">
    <div style="width: 100%; max-width: 420px; background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 20px; box-shadow: 0 18px 48px rgba(20,18,30,.08); padding: 32px 32px 28px; box-sizing: border-box">

      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 14px; background: #2F4A6D; color: #FFFFFF; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center">N</span>
        <div style="min-width: 0">
          <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15">{{title}}</h1>
          <div aria-label="{{tPeopleAria}}" style="display: flex; margin-top: 8px">
            <span style="width: 24px; height: 24px; border-radius: 7px; background: #1D4ED8; color: #FFFFFF; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFFFF">JB</span>
            <span style="width: 24px; height: 24px; margin-left: -5px; border-radius: 7px; background: #7E22CE; color: #FFFFFF; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFFFF">ML</span>
            <span style="width: 24px; height: 24px; margin-left: -5px; border-radius: 7px; background: #C2410C; color: #FFFFFF; font-size: 9.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #FFFFFF">IH</span>
          </div>
        </div>
      </div>

      <sc-if value="{{isJoin}}" hint-placeholder-val="{{true}}">
        <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; box-sizing: border-box; border-radius: 11px; background: #F4F3EF; font-size: 15px; color: #55535C">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg>
            <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">henrik@nordlys.no</span>
          </div>
          <div>
            <label for="il-name" style="display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px">{{tName}}</label>
            <input id="il-name" class="il-input" type="text" autocomplete="name" value="{{name}}" onChange="{{onName}}" style="display: block; width: 100%; height: 46px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #D9D6CF; border-radius: 11px; background: #FFFFFF; color: #1D1C22; font-family: inherit; font-size: 15px">
          </div>
          <div>
            <label for="il-pass" style="display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px">{{tPassword}}</label>
            <div style="position: relative">
              <input id="il-pass" class="il-input" type="{{passType}}" autocomplete="new-password" value="{{password}}" onChange="{{onPassword}}" onKeyDown="{{onKey}}" style="display: block; width: 100%; height: 46px; box-sizing: border-box; padding: 0 48px 0 14px; border: 1.5px solid #D9D6CF; border-radius: 11px; background: #FFFFFF; color: #1D1C22; font-family: inherit; font-size: 15px">
              <button onClick="{{togglePass}}" aria-label="{{passToggleLabel}}" aria-pressed="{{passShown}}" style="position: absolute; right: 5px; top: 5px; width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #55535C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
            </div>
            <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px">
              <span style="height: 4px; border-radius: 2px; background: {{bar1}}"></span><span style="height: 4px; border-radius: 2px; background: {{bar2}}"></span><span style="height: 4px; border-radius: 2px; background: {{bar3}}"></span><span style="height: 4px; border-radius: 2px; background: {{bar4}}"></span>
            </div>
          </div>
          <button onClick="{{join}}" disabled="{{joinDisabled}}" style="margin-top: 6px; height: 48px; border: 0; border-radius: 12px; background: {{joinBg}}; color: {{joinColor}}; font-size: 15.5px; font-weight: 600; cursor: pointer">{{tJoin}}</button>
        </div>
      </sc-if>

      <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
        <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 10px">
          <a href="ClientSpace.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 12px; background: #0E7C66; color: #FFFFFF; font-size: 15.5px; font-weight: 600; text-decoration: none">{{tOpen}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
          <a href="#" class="il-ghost" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border: 1px solid #D9D6CF; border-radius: 12px; background: #FFFFFF; color: #1D1C22; font-size: 15px; font-weight: 600; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>{{tDownloadMac}}</a>
          <button onClick="{{toggleOther}}" aria-expanded="{{otherExpanded}}" style="align-self: center; margin-top: 6px; display: flex; align-items: center; gap: 5px; padding: 6px 8px; border: 0; background: transparent; color: #55535C; font-size: 13.5px; font-weight: 500; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{otherChevron}}"></path></svg>{{tOther}}</button>
          <sc-if value="{{showOther}}" hint-placeholder-val="{{false}}">
            <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 12px; padding: 12px 14px; border-radius: 12px; background: #F4F3EF; font-size: 14px">
              <dt style="color: #55535C">{{tServer}}</dt><dd style="margin: 0; font-weight: 600">pasodrum.work</dd>
              <button class="il-ghost" aria-label="{{tCopyServer}}" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #55535C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>
              <dt style="color: #55535C">{{tUser}}</dt><dd style="margin: 0; font-weight: 600">henrik.dahl</dd>
              <button class="il-ghost" aria-label="{{tCopyUser}}" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #55535C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>
            </dl>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{isExpired}}" hint-placeholder-val="{{false}}">
        <div style="margin-top: 28px">
          <button onClick="{{requestNew}}" disabled="{{requested}}" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 0; border-radius: 12px; background: {{requestBg}}; color: {{requestColor}}; font-size: 15.5px; font-weight: 600; cursor: pointer">
            <sc-if value="{{requested}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>{{requestLabel}}</button>
        </div>
      </sc-if>
      <sc-if value="{{isUsed}}" hint-placeholder-val="{{false}}">
        <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; box-sizing: border-box; border-radius: 11px; background: #F4F3EF; font-size: 15px; color: #55535C">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg>
            <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">henrik@nordlys.no</span>
          </div>
          <a href="SignIn.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 12px; background: #0E7C66; color: #FFFFFF; font-size: 15.5px; font-weight: 600; text-decoration: none">{{tSignIn}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </div>
      </sc-if>

      <sc-if value="{{isWrong}}" hint-placeholder-val="{{false}}">
        <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; box-sizing: border-box; border-radius: 11px; background: #F4F3EF; font-size: 15px; color: #55535C">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg>
            <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">henrik@nordlys.no</span>
          </div>
          <button onClick="{{switchAccount}}" style="height: 48px; border: 0; border-radius: 12px; background: #0E7C66; color: #FFFFFF; font-size: 15.5px; font-weight: 600; cursor: pointer">{{tSwitch}}</button>
          <div aria-hidden="true" style="height: 1px; margin: 4px 0; background: #E8E6E1"></div>
          <a href="Main.dc.html" class="il-ghost" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px 0 10px; border: 1px solid #D9D6CF; border-radius: 12px; background: #FFFFFF; color: #1D1C22; font-size: 15px; font-weight: 600; text-decoration: none"><span style="position: relative; width: 32px; height: 32px; flex-shrink: 0; border-radius: 9px; background: #1D4ED8; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">JB<span style="position: absolute; right: -3px; bottom: -3px; width: 11px; height: 11px; border-radius: 6px; background: #2BAC76; box-shadow: 0 0 0 2px #FFFFFF"></span></span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{tStay}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6C76" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </div>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["join","done","expired","used","wrongAccount"],"default":"join"},"locale":{"editor":"enum","options":["en","ja"],"default":"en"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: null, name: 'Henrik Dahl', password: '', shown: false, other: false, requested: false };
  }
  renderVals() {
    const s = this.state;
    const step = s.step || this.props.state || 'join';
    const ja = this.props.locale === 'ja';
    const L = ja ? {
      join: 'Nordlys Energi に参加', done: '参加しました', expired: 'リンクの期限が切れています', used: 'このリンクは使用済みです',
      downloadApp: 'アプリをダウンロード', people: 'Jonas Berg、Maja Lind、Ingrid Holm がこのスペースにいます', name: '名前', password: 'パスワード', joinBtn: '参加',
      open: 'ブラウザで開く', mac: 'Mac 版をダウンロード', other: 'ほかのアプリ', server: 'サーバー', user: 'ユーザー名', copyServer: 'サーバーをコピー', copyUser: 'ユーザー名をコピー',
      hide: 'パスワードを隠す', show: 'パスワードを表示', request: '新しいリンクを送ってもらう', sent: '新しいリンクを送りました',
      signIn: 'サインイン', sw: 'サインアウトして参加', stay: 'Jonas Berg として続ける'
    } : {
      join: 'Join Nordlys Energi', done: 'You’re in', expired: 'Link expired', used: 'Link already used',
      downloadApp: 'Download app', people: 'Jonas Berg, Maja Lind and Ingrid Holm are in this space', name: 'Name', password: 'Password', joinBtn: 'Join',
      open: 'Open in browser', mac: 'Download for Mac', other: 'Another app', server: 'Server', user: 'Username', copyServer: 'Copy server', copyUser: 'Copy username',
      hide: 'Hide password', show: 'Show password', request: 'Send me a new link', sent: 'New link sent',
      signIn: 'Sign in', sw: 'Sign out and join', stay: 'Continue as Jonas Berg'
    };
    const len = s.password.length;
    const score = len === 0 ? 0 : len < 8 ? 1 : len < 12 ? 2 : /[^A-Za-z0-9]/.test(s.password) || len >= 16 ? 4 : 3;
    const on = score >= 3 ? '#0E7C66' : score === 2 ? '#C08A1E' : '#D4351C';
    const bar = (i) => (score >= i ? on : '#E8E6E1');
    const ok = s.name.trim().length > 0 && len >= 8;
    const join = () => { if (ok) this.setState({ step: 'done' }); };
    return {
      isJoin: step === 'join', isDone: step === 'done', isExpired: step === 'expired',
      title: step === 'done' ? L.done : step === 'expired' ? L.expired : step === 'used' ? L.used : L.join,
      isUsed: step === 'used', isWrong: step === 'wrongAccount', switchAccount: () => this.setState({ step: 'join' }),
      lang: ja ? 'ja' : 'en', cjk: ja ? '"Hiragino Sans", "Yu Gothic UI", Meiryo, "Noto Sans JP", ' : '',
      tDownloadApp: L.downloadApp, tPeopleAria: L.people, tName: L.name, tPassword: L.password, tJoin: L.joinBtn, tOpen: L.open, tDownloadMac: L.mac, tOther: L.other,
      tServer: L.server, tUser: L.user, tCopyServer: L.copyServer, tCopyUser: L.copyUser, tSignIn: L.signIn, tSwitch: L.sw, tStay: L.stay,
      name: s.name, onName: (e) => this.setState({ name: e.target.value }),
      password: s.password, onPassword: (e) => this.setState({ password: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter' && !e.nativeEvent?.isComposing) join(); },
      passType: s.shown ? 'text' : 'password',
      passShown: s.shown ? 'true' : 'false',
      passToggleLabel: s.shown ? L.hide : L.show,
      togglePass: () => this.setState({ shown: !s.shown }),
      bar1: bar(1), bar2: bar(2), bar3: bar(3), bar4: bar(4),
      join, joinDisabled: !ok,
      joinBg: ok ? '#0E7C66' : '#E8E6E1', joinColor: ok ? '#FFFFFF' : '#6E6C76',
      showOther: s.other, otherExpanded: s.other ? 'true' : 'false',
      otherChevron: s.other ? 'm6 9 6 6 6-6' : 'm9 6 6 6-6 6',
      toggleOther: () => this.setState({ other: !s.other }),
      requested: s.requested,
      requestNew: () => this.setState({ requested: true }),
      requestLabel: s.requested ? L.sent : L.request,
      requestBg: s.requested ? '#E2F2EC' : '#0E7C66', requestColor: s.requested ? '#0E7C66' : '#FFFFFF'
    };
  }
}
</script>
</body>
</html>
