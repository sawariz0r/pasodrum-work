<style>

.pd-root{--lh:1.5;font-family:Inter,var(--cjk),system-ui,sans-serif;color:var(--ink);line-height:var(--lh);-webkit-font-smoothing:antialiased}
.pd-root button{font-family:inherit}
.pd-ja{--lh:1.7}
.pd-ja h1,.pd-ja h2,.pd-ja h3{letter-spacing:0!important}
.pd-clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.rs-crop{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 0 0 1px rgba(20,18,30,.10),0 6px 20px rgba(20,18,30,.06)}

<div class="rs-root" style="width: 1440px; min-height: 781px; box-sizing: border-box; padding: 48px 56px; background: #FBFAF8; color: #1D1C22; font-family: Inter, var(--cjk), system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">
  <h1 style="margin: 0; font-family: 'Space Grotesk', var(--cjk), sans-serif; font-size: 36px; font-weight: 700; letter-spacing: -0.02em">Docs: file block</h1>
  <div style="display: flex; flex-direction: column; gap: 28px">
<section style="background: #FFFFFF; border: 1px solid #E8E6E1; border-radius: 18px; padding: 24px 26px"><h2 style="margin: 0 0 16px; font-family: 'Space Grotesk', var(--cjk), sans-serif; font-size: 20px; font-weight: 700">File in a page</h2><div style="display: flex; flex-direction: column; gap: 36px; padding: 36px 24px; border-radius: 14px; background: #F4F3EF"><div style="display: flex; gap: 40px; align-items: flex-start; justify-content: center"><figure style="margin: 0; width: 594px"><figcaption style="margin: 0 0 12px; font-size: 13px; font-weight: 700; color: #55535C">EN · light · hovering the file block</figcaption><div class="rs-crop pd-root pd-light pd-en" lang="en" style="width: 594px; background: var(--bg); "><article style="padding: 40px 32px 36px 72px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.65"><h1 style="margin: 0 0 6px; font-family: 'Space Grotesk', var(--cjk), sans-serif; font-size: 38px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; color: var(--ink)">Onboarding flow</h1><p style="margin: 0">How a new client gets from the invite email to their first message. For the Nordlys review with <span style="background: var(--chip); color: var(--link); font-weight: 600; border-radius: 4px; padding: 1px 3px">@Henrik Dahl</span> on Thursday.</p><div style="position: relative"><div style="position: absolute; left: -54px; top: 2px; display: flex; gap: 2px; color: var(--subtle)"><span aria-label="Add a block" style="width: 24px; height: 24px; border-radius: 6px; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span><span aria-label="Drag to move" style="width: 20px; height: 24px; border-radius: 6px; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="6" r="1.1"></circle><circle cx="15" cy="6" r="1.1"></circle><circle cx="9" cy="12" r="1.1"></circle><circle cx="15" cy="12" r="1.1"></circle><circle cx="9" cy="18" r="1.1"></circle><circle cx="15" cy="18" r="1.1"></circle></svg></span></div><div style="width: 400px; max-width: 100%; box-sizing: border-box; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--raised)"><div style="display: flex; align-items: center; gap: 12px; padding: 9px 10px 9px 12px"><span aria-hidden="true" style="display: flex; flex-shrink: 0; align-items: flex-end; justify-content: center; box-sizing: border-box; width: 32px; height: 38px; padding-bottom: 5px; border-radius: 6px; background: #B42318; color: #FFFFFF; font-size: 8.5px; font-weight: 800; letter-spacing: .02em; line-height: normal; clip-path: polygon(0 0, 68% 0, 100% 24%, 100% 100%, 0 100%)">PDF</span><span style="flex: 1; min-width: 0"><span style="display: block; overflow: hidden; color: var(--ink); font-size: 13.5px; font-weight: 600; line-height: normal; text-overflow: ellipsis; white-space: nowrap">Nordlys onboarding review.pdf</span><span style="display: block; color: var(--subtle); font-size: 12px; line-height: normal">2.4 MB</span></span><span aria-label="Download Nordlys onboarding review.pdf" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; color: var(--muted); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg></span></div></div></div><h2 style="margin: 14px 0 0; font-family: 'Space Grotesk', var(--cjk), sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink)">Goals</h2><div style="display: flex; gap: 10px; align-items: flex-start"><span style="flex: none; width: 18px; height: 18px; margin-top: 3px; border-radius: 5px; background: var(--accent); color: var(--onaccent); display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span><span style="color: var(--subtle)">Join from the email link, no download</span></div></article></div></figure><figure style="margin: 0; width: 594px"><figcaption style="margin: 0 0 12px; font-size: 13px; font-weight: 700; color: #55535C">JP · dark</figcaption><div class="rs-crop pd-root pd-dark pd-ja" lang="ja" style="width: 594px; background: var(--bg); "><article style="padding: 40px 32px 36px 72px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.65"><h1 style="margin: 0 0 6px; font-family: 'Space Grotesk', var(--cjk), sans-serif; font-size: 38px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; color: var(--ink)">リリース計画</h1><p style="margin: 0">12月のリリースに向けた計画です。木曜日の Nordlys レビューまでに確認してください。</p><div style="position: relative"><div style="width: 400px; max-width: 100%; box-sizing: border-box; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--raised)"><div style="display: flex; align-items: center; gap: 12px; padding: 9px 10px 9px 12px"><span aria-hidden="true" style="display: flex; flex-shrink: 0; align-items: flex-end; justify-content: center; box-sizing: border-box; width: 32px; height: 38px; padding-bottom: 5px; border-radius: 6px; background: #15803D; color: #FFFFFF; font-size: 8.5px; font-weight: 800; letter-spacing: .02em; line-height: normal; clip-path: polygon(0 0, 68% 0, 100% 24%, 100% 100%, 0 100%)">XLSX</span><span style="flex: 1; min-width: 0"><span style="display: block; overflow: hidden; color: var(--ink); font-size: 13.5px; font-weight: 600; line-height: normal; text-overflow: ellipsis; white-space: nowrap">release-checklist.xlsx</span><span style="display: block; color: var(--subtle); font-size: 12px; line-height: normal">18 KB</span></span><span aria-label="release-checklist.xlsx をダウンロード" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; color: var(--muted); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg></span></div></div></div><h2 style="margin: 14px 0 0; font-family: 'Space Grotesk', var(--cjk), sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink)">目標</h2><div style="display: flex; gap: 10px; align-items: flex-start"><span style="flex: none; width: 18px; height: 18px; margin-top: 3px; border-radius: 5px; background: var(--accent); color: var(--onaccent); display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg></span><span style="color: var(--subtle)">招待メールから1分以内に参加できる</span></div></article></div></figure></div></div><p style="margin: 14px 0 0; font-size: 13px; color: #55535C">A file that isn’t an image becomes this block, the same card as a file in chat; the arrow downloads it.</p></section>
  </div>
</div>
