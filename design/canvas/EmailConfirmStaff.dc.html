<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "lang": {"editor": "enum", "options": ["en", "ja"], "default": "en"}, "reason": {"editor": "enum", "options": ["email", "stuck", "link"], "default": "email"}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
  strings(ja) {
    return ja ? {
      railLabel: 'ワークスペースとセクション', rail_home: 'ホーム', rail_dms: 'DM', rail_activity: '通知', rail_docs: 'ドキュメント', rail_boards: 'ボード',
      needs: 'Henrik Dahl さんがサポートを求めています', local: '現地時刻 07:12', email: 'メールを送る', profile: 'プロフィール',
      email_r: '新しいデバイスの確認メールが届いていません。', stuck_r: '新しいデバイスの確認で困っています。', link_r: '確認リンクが使えませんでした。'

    } : {
      railLabel: 'Workspaces and sections', rail_home: 'Home', rail_dms: 'DMs', rail_activity: 'Activity', rail_docs: 'Docs', rail_boards: 'Boards',
      needs: 'Henrik Dahl needs your help', local: 'their time 07:12', email: 'Email Henrik', profile: 'View profile',
      email_r: 'The email to confirm their new device didn’t arrive.', stuck_r: 'They’re stuck confirming a new device.', link_r: 'The confirm link didn’t work for them.'

    };
  }
  renderVals() {
    const p = this.props;
    const ja = (p.lang ?? 'en') === 'ja';
    const t = this.strings(ja);
    const r = p.reason ?? 'email';
    return {
      t, lang: ja ? 'ja' : 'en', langClass: ja ? 'pd-ja' : '',
      themeClass: (p.theme ?? 'light') === 'dark' ? 'pd-dark' : 'pd-light',
      me: { name: 'Jonas Berg', bg: '#1D4ED8', ini: 'JB' }, isTeam: true, ringP: 'none', ringN: 'none',
      reason: t[r + '_r']
    };
  }
}
</script>
