name: pasodrum-dev

services:
  continuwuity:
    image: forgejo.ellis.link/continuwuation/continuwuity:latest
    command: /sbin/conduwuit
    restart: unless-stopped
    environment:
      CONTINUWUITY_CONFIG: /etc/continuwuity.toml
      CONTINUWUITY_REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:?set REGISTRATION_TOKEN in dev/.env}
    volumes:
      - ./continuwuity.toml:/etc/continuwuity.toml:ro
      - continuwuity-data:/var/lib/continuwuity

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [continuwuity]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

  invite:
    build:
      context: ..
      dockerfile: services/invite/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_NAME: pasodrum.localhost
      MATRIX_URL: http://continuwuity:6167
      PUBLIC_URL: http://localhost:5173
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:?set REGISTRATION_TOKEN in dev/.env}
      INVITE_SECRET: ${INVITE_SECRET:?set INVITE_SECRET in dev/.env}
      MAIL_FROM: Pasodrum work <invites@pasodrum.localhost>
      MAILPIT_URL: http://mailpit:8025
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_DAILY_LIMIT: ${TRANSLATE_DAILY_LIMIT:-}
    volumes:
      - invite-data:/data
    depends_on: [continuwuity, mailpit]

volumes:
  continuwuity-data:
  invite-data:
