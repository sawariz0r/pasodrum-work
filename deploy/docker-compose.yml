# Production on Coolify (Docker Compose build pack, D-17/D-18). Coolify's proxy terminates TLS.
# Coolify: Base Directory "/deploy", Docker Compose Location "/docker-compose.yml".
# Set SERVER_NAME (e.g. pasodrum.work). Only the web service gets a domain: https://<SERVER_NAME>:80.
# web serves the app and forwards /_matrix, /_continuwuity and /.well-known/matrix to continuwuity, /api/invites, /api/translate and /api/presence (a WebSocket) to invite.
# /download/mac serves the Mac app and its update feed from the host folder /data/pasodrum-downloads/mac (apps/desktop-electron/README.md).
# Set RESEND_API_KEY (sending-only, noreply.prpl.se) for invite mail (D-26); MAIL_FROM is optional.
# Resend's open and click tracking are per domain: keep both off for noreply.prpl.se (confirm links are single use).
# Coolify generates CONFIRM_KEY_SECRET and SYSTEM_PASSWORD (D-38); losing CONFIRM_KEY_SECRET means every client starts fresh.
# The invite service creates (or signs in as) the system sender @pasodrum itself at startup; nothing to copy out of Coolify.
# Set WORKSPACE_ID to the workspace's room ID ("!…"; pnpm bootstrap prints it for a new workspace). Until it is set,
# invites, removal, Translate, device confirmation and the Assistant are refused; #workspace is never trusted for them.
# Set OPENAI_API_KEY to turn on Translate (TRANSLATE_MODEL overrides the default gpt-6-luna); TRANSLATE_DAILY_LIMIT (calls per UTC day, all callers) is optional.
services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - /data/pasodrum-downloads:/srv/download:ro
    depends_on:
      - continuwuity
      - invite

  invite:
    build:
      context: ..
      dockerfile: services/invite/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?}
      PUBLIC_URL: https://${SERVER_NAME:?}
      MATRIX_URL: http://continuwuity:6167
      REGISTRATION_TOKEN: ${SERVICE_PASSWORD_64_REGISTRATION}
      INVITE_SECRET: ${SERVICE_PASSWORD_64_INVITESECRET}
      CONFIRM_KEY_SECRET: ${SERVICE_PASSWORD_64_CONFIRMKEYS}
      SYSTEM_PASSWORD: ${SERVICE_PASSWORD_64_SYSTEM}
      WORKSPACE_ID: ${WORKSPACE_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM:-Pasodrum work <invites@noreply.prpl.se>}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      TRANSLATE_DAILY_LIMIT: ${TRANSLATE_DAILY_LIMIT:-2000}
      ASSISTANT_OPENAI_API_KEY: ${ASSISTANT_OPENAI_API_KEY:-}
      ASSISTANT_QUICK: ${ASSISTANT_QUICK:-}
      ASSISTANT_THOROUGH: ${ASSISTANT_THOROUGH:-}
      ASSISTANT_PRICES: ${ASSISTANT_PRICES:-}
      ASSISTANT_DAY_USD: ${ASSISTANT_DAY_USD:-}
      ASSISTANT_MONTH_USD: ${ASSISTANT_MONTH_USD:-}
      ASSISTANT_DB_PATH: ${ASSISTANT_DB_PATH:-}
    expose:
      - "8080"
    volumes:
      - invite-data:/data
    depends_on:
      - continuwuity

  continuwuity:
    image: forgejo.ellis.link/continuwuation/continuwuity:latest
    command: /sbin/conduwuit
    restart: unless-stopped
    environment:
      CONTINUWUITY_SERVER_NAME: ${SERVER_NAME:?}
      CONTINUWUITY_WELL_KNOWN__CLIENT: https://${SERVER_NAME:?}
      CONTINUWUITY_REGISTRATION_TOKEN: ${SERVICE_PASSWORD_64_REGISTRATION}
      CONTINUWUITY_DATABASE_PATH: /var/lib/continuwuity
      CONTINUWUITY_ADDRESS: 0.0.0.0
      CONTINUWUITY_PORT: 6167
      CONTINUWUITY_ALLOW_FEDERATION: "false"
      CONTINUWUITY_ALLOW_REGISTRATION: "true"
      CONTINUWUITY_ALLOW_LOCAL_PRESENCE: "true"
      CONTINUWUITY_NEW_USER_DISPLAYNAME_SUFFIX: ""
      CONTINUWUITY_MAX_REQUEST_SIZE: "53000000"
      CONTINUWUITY_URL_PREVIEW_DOMAIN_CONTAINS_ALLOWLIST: '["*"]'
    expose:
      - "6167"
    volumes:
      - continuwuity-data:/var/lib/continuwuity

volumes:
  continuwuity-data:
  invite-data:
